[project]
name = "example_pyproject"
version = "0.0.1a1"
license = "MIT"
license-files = ["LICENSE.txt"] 
authors = [
	{name = "Maggie May", email = "maggie.may@gmail.com"}
]

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=74.1.0",
    "cython>=3",
]
[project.optional-dependencies]
examples = [
    "jupyter",
    "matplotlib",
    "scikit-image[data]",
]
docs = [
    "mkdocs-material",
]